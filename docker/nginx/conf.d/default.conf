
# 在http区域内一定要添加下面配置, 支持websocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}



server {
	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/xml text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	listen 3001;

	 location / {
		root /usr/share/nginx/html/platform;
		index index.html index.htm;
		# 禁止浏览器缓存 index.html
		location = /index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /index.html =404;
		# 允许在其他网页中嵌入
		# 使用 Content-Security-Policy（现代标准）
		add_header Content-Security-Policy "frame-ancestors *" always;
		# 如果上面的方案不行，取消下面的注释并注释掉上面的 Content-Security-Policy
		# 注意：需要将 YOUR_EMBEDDING_DOMAIN 替换为实际嵌入页面的域名，例如：http://localhost:8083
		# add_header X-Frame-Options "ALLOW-FROM YOUR_EMBEDDING_DOMAIN" always;
	}

	location /workspace/ {
		alias /usr/share/nginx/html/client/;
		index index.html index.htm;
		# 禁止浏览器缓存 /workspace/index.html
		location = /workspace/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /workspace/index.html;
	}

	location ~ ^(/workspace)?/api(/|$) {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://backend:7860;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 200m;
		add_header Access-Control-Allow-Origin $host;
		# 允许在其他网页中嵌入
		# 使用 Content-Security-Policy（现代标准）
		add_header Content-Security-Policy "frame-ancestors *" always;
		# 如果上面的方案不行，取消下面的注释并注释掉上面的 Content-Security-Policy
		# 注意：需要将 YOUR_EMBEDDING_DOMAIN 替换为实际嵌入页面的域名，例如：http://localhost:8083
		# add_header X-Frame-Options "ALLOW-FROM YOUR_EMBEDDING_DOMAIN" always;
	}

	location ~ ^(/workspace)?/bisheng|/tmp-dir {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://minio:9000;
	}
}