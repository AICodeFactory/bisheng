
# 在http区域内一定要添加下面配置, 支持websocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/xml text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	listen 3001;

	location / {
		root /usr/share/nginx/html/platform;
		index index.html index.htm;
		# 禁止浏览器缓存 index.html
		location = /index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /index.html =404;
        proxy_set_header X-Forwarded-Proto https;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location /workspace/ {
		alias /usr/share/nginx/html/client/;
		index index.html index.htm;
		# 禁止浏览器缓存 /workspace/index.html
		location = /workspace/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /workspace/index.html;
	}

	location ~ ^(/workspace)?/api(/|$) {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://172.20.8.118:8080;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 200m;
		add_header X-Frame-Options SAMEORIGIN;
        
        # CORS 配置 - 添加 always 确保错误响应(502/504等)也包含这些头
        # 注意：如果你需要携带 Cookie(Allow-Credentials)，Origin 不能为 *，必须使用 $http_origin
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With, Origin, X-CSRF-Token" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Max-Age 86400 always;
        
        # 处理预检请求（OPTIONS），直接返回 204，避免转发到后端
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
	}

	location ~ ^(/workspace)?/bisheng|/tmp-dir {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://minio:9000;
	}
}